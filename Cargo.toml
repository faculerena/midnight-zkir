[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

[workspace.lints.clippy]
redundant_clone = "warn"
or_fun_call = "warn"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Faster key generation (keygen_for_write_with_k, setup_keys_for_write and the
# changes they rely on), not released yet: branch fast-keygen-0.8 of
# faculerena/midnight-zk, on top of the releases of these versions.
[patch.crates-io]
midnight-proofs = { git = "https://github.com/faculerena/midnight-zk", rev = "5eaefa3b218e0d1a6fb18f1eca8a94cf2dbd0920" }
midnight-circuits = { git = "https://github.com/faculerena/midnight-zk", rev = "5eaefa3b218e0d1a6fb18f1eca8a94cf2dbd0920" }
midnight-zk-stdlib = { git = "https://github.com/faculerena/midnight-zk", rev = "5eaefa3b218e0d1a6fb18f1eca8a94cf2dbd0920" }
